<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Status-bar area color. STATIC per-scheme metas (not a runtime JS swap):
         iOS honors prefers-color-scheme theme-color and updates it live, whereas
         a single JS-mutated meta gets cached at launch in standalone mode (that
         cached-swap approach was tried and produced a stuck black band). Each
         value matches the app header in that scheme so the bar and header read
         as one surface.
         These are --bg-secondary in each theme (index.css), because the header
         is bg-bg-secondary. The Matchday repaint moved both grounds, so both
         values moved with them: light #E7E9EC -> #E8E5DC, dark #101013 ->
         #141413. A mismatch here shows as a status bar that does not match the
         header, and PWA meta changes are SILENT until the home-screen app is
         removed and re-added — so this is verified on device, not in a
         browser. -->
    <meta name="theme-color" content="#E8E5DC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
    <!-- Standalone (Add to Home Screen) mode. `default` status-bar-style makes
         iOS draw an OPAQUE status bar and auto-contrast the clock/battery text
         to the appearance (black on light, white on dark) — so no hand-drawn
         dark strip is needed and the bar matches the header in both themes.
         (black-translucent, the prior setting, forced white text and required a
         light-mode dark strip behind it.) Changing these metas only takes effect
         after removing + re-adding the home-screen app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DynastyEdge" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>DynastyEdge</title>
    <!-- ?v=3 busts Safari's stubborn per-site icon cache (Favorites grid) -->
    <link rel="icon" href="favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=3" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3" />
    <!-- Data-API origins gate first data paint on cellular; crossorigin
         because they're hit via fetch() (CORS mode). -->
    <link rel="preconnect" href="https://api.sleeper.app" crossorigin />
    <link rel="preconnect" href="https://api.fantasycalc.com" crossorigin />
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Matchday's faces (DESIGN-1). Bricolage Grotesque replaced Anton for
         display: Anton ships ONE weight, so the type scale could only ever work
         through size. Bricolage is requested across its REAL axis ranges —
         opsz 12..96, wdth 75..100, wght 200..800. Those are the font's actual
         limits (probed against the Google Fonts API 2026-09-11); asking for the
         `wdth 125` the design mock specifies returns HTTP 400, because 100 is
         both this face's maximum width and its default. See the note in
         index.css. Archivo gains its ITALIC axis (the `.aside` voice);
         IBM Plex Mono keeps the figures. Three families, as before the swap. -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Archivo:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
